name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Test suite (records, trust, sync, attestation, colour, NCB kit, end to end)
        run: pytest
      - name: End-to-end demo
        run: python demo/run_demo.py
      - name: Keep the demo report
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo/output/
